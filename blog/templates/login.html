{% extends 'base.html' %}

{% block title %}Login | NovaCart{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container auth-shell">
        <div class="auth-card">
            <span class="eyebrow">Welcome back</span>
            <h1>Sign in to your account</h1>
            <p>Access your orders, saved items, and account details.</p>

            <form class="auth-form">
                <label>
                    Email address
                    <input type="email" placeholder="you@example.com">
                </label>
                <label>
                    Password
                    <input type="password" placeholder="Enter your password">
                </label>
                <div class="form-row">
                    <label class="checkbox-row"><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="auth-switch">New customer? <a href="{% url 'register_view' %}">Create an account</a></p>
        </div>
    </div>
</section>
{% endblock %}
