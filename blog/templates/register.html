{% extends 'base.html' %}

{% block title %}Register | NovaCart{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container auth-shell">
        <div class="auth-card">
            <span class="eyebrow">Create account</span>
            <h1>Join NovaCart today</h1>
            <p>Unlock exclusive drops, faster checkout, and personalized recommendations.</p>

            <form class="auth-form">
                <div class="field-row">
                    <label>
                        First name
                        <input type="text" placeholder="Jane">
                    </label>
                    <label>
                        Last name
                        <input type="text" placeholder="Doe">
                    </label>
                </div>
                <label>
                    Email address
                    <input type="email" placeholder="you@example.com">
                </label>
                <label>
                    Password
                    <input type="password" placeholder="Create a password">
                </label>
                <label>
                    Confirm password
                    <input type="password" placeholder="Repeat password">
                </label>
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="{% url 'login_view' %}">Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
